name: Arcade Architecture Analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    name: Arcade Architecture Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Run arcade-agent architecture analysis
        uses: arcade-agent/arcade-agent/actions/analyze@v0.3.0
        with:
          source-path: "."
          language: "python"
          post-pr-comment: "true"
